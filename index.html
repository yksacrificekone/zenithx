<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zenith</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--bg4:#1e1e32;--text:#e8e8f0;--text2:#a0a0b8;--text3:#6a6a82;--accent:#7c3aed;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--border:#2a2a42;--radius:12px;--shadow:0 8px 32px rgba(0,0,0,0.6)}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:var(--bg2)}
        ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
        
        #auth{display:none;position:fixed;inset:0;z-index:999;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1a2e,#0a0a0f)}
        #auth.active{display:flex}
        .auth-box{background:var(--bg4);padding:48px;border-radius:var(--radius);width:100%;max-width:420px;border:1px solid var(--border);box-shadow:var(--shadow)}
        .auth-box .logo{text-align:center;font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
        .auth-box .sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:32px}
        .auth-box input{width:100%;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;margin-bottom:12px;outline:none}
        .auth-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,0.2)}
        .auth-box .btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
        .auth-box .btn:hover{background:var(--accent2)}
        .auth-box .btn:disabled{opacity:.5;cursor:not-allowed}
        .auth-box .switch{text-align:center;margin-top:16px;color:var(--text2);font-size:14px}
        .auth-box .switch a{color:var(--accent2);cursor:pointer}
        .auth-box .err{color:var(--red);font-size:13px;text-align:center;min-height:20px;margin-top:4px}
        .auth-box .dl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
        .auth-box .dl a{padding:6px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:12px;cursor:pointer;text-decoration:none}
        .auth-box .dl a:hover{background:var(--bg3);color:var(--text)}
        
        #app{display:none;height:100vh;width:100vw;overflow:hidden}
        #app.active{display:flex}
        
        .sidebar{width:72px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;border-right:1px solid var(--border);flex-shrink:0;overflow-y:auto;z-index:10}
        .sidebar .logo{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;cursor:pointer}
        .sidebar .nav{width:48px;height:48px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-size:20px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;position:relative}
        .sidebar .nav:hover{background:var(--bg3);color:var(--text)}
        .sidebar .nav.active{background:var(--accent);color:#fff;border-radius:16px}
        .sidebar .nav .badge{position:absolute;top:4px;right:4px;width:18px;height:18px;background:var(--red);border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
        .sidebar .nav .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff}
        .sidebar .divider{width:32px;height:2px;background:var(--border);border-radius:1px;margin:4px 0}
        .sidebar .bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
        
        .csidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
        .csidebar .head{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;min-height:60px;cursor:pointer}
        .csidebar .head:hover{background:var(--bg3)}
        .csidebar .section{padding:12px 8px;overflow-y:auto;flex:1}
        .csidebar .label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px 4px;display:flex;justify-content:space-between;align-items:center}
        .csidebar .label .add{background:0;border:0;color:var(--text3);cursor:pointer;font-size:16px}
        .csidebar .label .add:hover{color:var(--text)}
        .csidebar .chan{padding:6px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);transition:.2s}
        .csidebar .chan:hover{background:var(--bg3);color:var(--text)}
        .csidebar .chan.active{background:var(--bg3);color:var(--text)}
        .csidebar .chan .icon{font-size:16px;opacity:.6}
        .csidebar .chan .vi{margin-left:auto;font-size:12px;color:var(--green)}
        
        .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
        .main .head{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;min-height:60px;background:var(--bg2)}
        .main .head .name{font-size:18px;font-weight:600}
        .main .head .name .hash{color:var(--text3);font-weight:400}
        .main .head .actions{display:flex;gap:8px}
        .main .head .actions button{background:0;border:0;color:var(--text3);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:8px}
        .main .head .actions button:hover{background:var(--bg3);color:var(--text)}
        
        .msgs{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:2px}
        .msgs .empty{text-align:center;color:var(--text3);margin:auto;font-size:14px}
        .msgs .empty .icon{font-size:48px;margin-bottom:12px;display:block}
        .msg{display:flex;gap:12px;padding:4px 12px;border-radius:8px;transition:.2s}
        .msg:hover{background:var(--bg3)}
        .msg .av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#fff}
        .msg .body{flex:1;min-width:0}
        .msg .body .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .msg .body .hd .un{font-weight:600;font-size:14px}
        .msg .body .hd .ts{font-size:11px;color:var(--text3)}
        .msg .body .txt{font-size:15px;word-wrap:break-word;margin-top:2px;line-height:1.5}
        .msg .body .txt img{max-width:300px;max-height:300px;border-radius:8px;margin-top:4px;cursor:pointer}
        .msg .actions{display:none;gap:4px;margin-left:auto}
        .msg:hover .actions{display:flex}
        .msg .actions button{background:0;border:0;color:var(--text3);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px}
        .msg .actions button:hover{background:var(--bg3);color:var(--text)}
        .msg .actions .del:hover{color:var(--red)}
        .msg .edited{font-size:11px;color:var(--text3);font-style:italic}
        .msg.system{text-align:center;color:var(--text3);font-size:13px;padding:8px;justify-content:center}
        .msg.system .av{display:none}
        .msg.system .body{text-align:center}
        
        .typing{padding:4px 24px 8px;font-size:13px;color:var(--text3);min-height:28px;display:none;align-items:center;gap:4px}
        .typing .dots span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--text3);margin:0 2px;animation:dot 1.4s infinite}
        .typing .dots span:nth-child(2){animation-delay:.2s}
        .typing .dots span:nth-child(3){animation-delay:.4s}
        @keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
        
        .composer{padding:12px 24px 20px;background:var(--bg2);border-top:1px solid var(--border)}
        .composer .inner{display:flex;gap:8px;align-items:flex-end;background:var(--bg3);border-radius:8px;padding:4px 12px;border:1px solid var(--border)}
        .composer .inner:focus-within{border-color:var(--accent)}
        .composer .inner .attach{background:0;border:0;color:var(--text3);cursor:pointer;font-size:20px;padding:8px 4px}
        .composer .inner .attach:hover{color:var(--text)}
        .composer .inner textarea{flex:1;background:0;border:0;color:var(--text);padding:10px 0;font-size:15px;resize:none;font-family:inherit;min-height:44px;max-height:120px;outline:0}
        .composer .inner textarea::placeholder{color:var(--text3)}
        .composer .inner .send{background:var(--accent);border:0;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;transition:.2s;margin-bottom:4px;white-space:nowrap}
        .composer .inner .send:hover{background:var(--accent2)}
        .composer .inner .send:disabled{opacity:.5;cursor:not-allowed}
        .composer .fp{display:none;padding:8px 0;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
        .composer .fp.active{display:flex}
        .composer .fp .rm{cursor:pointer;color:var(--red);font-weight:700}
        
        .rpanel{width:240px;background:var(--bg2);border-left:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0;display:none}
        .rpanel.active{display:block}
        .rpanel .title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
        .rpanel .member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;transition:.2s;cursor:pointer}
        .rpanel .member:hover{background:var(--bg3)}
        .rpanel .member .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
        .rpanel .member .name{font-size:14px;flex:1}
        .rpanel .member .dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
        .rpanel .member .dot.online{background:var(--green)}
        
        .voice{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg4);border-radius:var(--radius);padding:20px 32px;border:1px solid var(--border);box-shadow:var(--shadow);z-index:100;min-width:320px;backdrop-filter:blur(12px)}
        .voice.active{display:block}
        .voice .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .voice .hd .title{font-weight:600;font-size:16px}
        .voice .hd .close{background:0;border:0;color:var(--text3);cursor:pointer;font-size:20px}
        .voice .parts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
        .voice .part{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;background:var(--bg2);border-radius:8px;min-width:60px}
        .voice .part .av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;position:relative}
        .voice .part .av .ring{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--green);animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.5}}
        .voice .part .name{font-size:12px;color:var(--text2)}
        .voice .ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
        .voice .ctrl button{padding:8px 16px;border:0;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:.2s;background:var(--bg2);color:var(--text);display:flex;align-items:center;gap:6px}
        .voice .ctrl button:hover{background:var(--bg3)}
        .voice .ctrl .mute.active{background:var(--red);color:#fff}
        .voice .ctrl .video.active{background:var(--green);color:#fff}
        .voice .ctrl .leave{background:var(--red);color:#fff}
        .voice .ctrl .leave:hover{background:#dc2626}
        .voice .local{width:160px;height:120px;background:var(--bg2);border-radius:8px;margin:8px auto;display:none;overflow:hidden}
        .voice .local.active{display:block}
        .voice .local video{width:100%;height:100%;object-fit:cover}
        .voice .remote{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
        .voice .remote video{width:120px;height:90px;background:var(--bg2);border-radius:8px;object-fit:cover}
        
        .settings{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
        .settings.active{display:flex}
        .settings .box{background:var(--bg4);border-radius:var(--radius);padding:32px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto;border:1px solid var(--border);box-shadow:var(--shadow)}
        .settings .box .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
        .settings .box .hd h2{font-size:24px;font-weight:700}
        .settings .box .hd .close{background:0;border:0;color:var(--text3);font-size:28px;cursor:pointer}
        .settings .box .hd .close:hover{color:var(--text)}
        .settings .box .grp{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
        .settings .box .grp:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
        .settings .box .grp label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:4px}
        .settings .box .grp input,.settings .box .grp select{width:100%;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:0}
        .settings .box .grp input:focus,.settings .box .grp select:focus{border-color:var(--accent)}
        .settings .box .grp .btn-save{padding:8px 20px;background:var(--accent);border:0;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;transition:.2s}
        .settings .box .grp .btn-save:hover{background:var(--accent2)}
        .settings .box .grp .btn-danger{padding:8px 20px;background:var(--red);border:0;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;transition:.2s}
        .settings .box .grp .btn-danger:hover{background:#dc2626}
        
        .toasts{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
        .toast{padding:12px 20px;background:var(--bg4);border-radius:8px;border:1px solid var(--border);color:var(--text);font-size:14px;box-shadow:var(--shadow);animation:slide .3s ease;max-width:360px}
        .toast.error{border-left:4px solid var(--red)}
        .toast.success{border-left:4px solid var(--green)}
        .toast.info{border-left:4px solid var(--accent)}
        @keyframes slide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        
        @media(max-width:1024px){.rpanel{display:none!important}.csidebar{width:200px}}
        @media(max-width:768px){.sidebar{width:56px;padding:12px 0}.sidebar .nav{width:40px;height:40px;font-size:16px}.csidebar{display:none}.csidebar.mobile{display:flex;position:fixed;left:56px;top:0;bottom:0;width:260px;z-index:50;box-shadow:var(--shadow)}.main .head{padding:12px 16px}.msgs{padding:12px 16px}.composer{padding:8px 16px 16px}.auth-box{padding:24px;margin:16px}.voice{min-width:auto;width:90%;bottom:70px;padding:16px}.voice .part .av{width:36px;height:36px}}
        @media(max-width:480px){.sidebar{width:48px}.sidebar .nav{width:36px;height:36px;font-size:14px}.msg .av{width:28px;height:28px;font-size:12px}.msg .txt{font-size:14px}.composer .inner textarea{font-size:14px;min-height:36px}.composer .inner .send{padding:6px 12px;font-size:13px}}
    </style>
</head>
<body>

<div class="toasts" id="toasts"></div>

<div id="auth" class="active">
    <div class="auth-box">
        <div class="logo">ZENITH</div>
        <div class="sub">Connect. Communicate. Create.</div>
        <form id="authForm">
            <input type="text" id="authUser" placeholder="Username" required>
            <input type="password" id="authPass" placeholder="Password" required>
            <div class="err" id="authErr"></div>
            <button class="btn" id="authBtn" type="submit">Sign In</button>
            <div class="switch"><span id="switchText">Don't have an account?</span> <a id="switchLink">Sign Up</a></div>
        </form>
        <div class="dl">
            <a href="#">Windows</a>
            <a href="#">macOS</a>
            <a href="#">Linux</a>
            <a href="#">Web</a>
        </div>
    </div>
</div>

<div id="app">
    <div class="sidebar">
        <div class="logo" onclick="navigate('home')">Z</div>
        <button class="nav active" id="navHome" onclick="navigate('home')">🏠</button>
        <button class="nav" id="navFriends" onclick="navigate('friends')">👥</button>
        <button class="nav" id="navDMs" onclick="navigate('dms')">💬</button>
        <div class="divider"></div>
        <button class="nav" onclick="openSettings()">⚙️</button>
        <div class="bottom">
            <button class="nav" onclick="logout()">🚪</button>
            <div class="nav"><div class="av" id="navAv">Z</div></div>
        </div>
    </div>

    <div class="csidebar" id="csidebar">
        <div class="head"><span id="commName">Zenith</span><span>▼</span></div>
        <div class="section" id="channels">
            <div class="label"><span>Text Channels</span><button class="add" onclick="createChan('text')">+</button></div>
            <div id="textChans"></div>
            <div class="label" style="margin-top:12px"><span>Voice Channels</span><button class="add" onclick="createChan('voice')">+</button></div>
            <div id="voiceChans"></div>
        </div>
    </div>

    <div class="main">
        <div class="head">
            <div class="name"><span class="hash">#</span> <span id="chanName">general</span></div>
            <div class="actions">
                <button onclick="toggleMembers()">👥</button>
                <button onclick="toggleMobile()" id="mobileBtn">☰</button>
            </div>
        </div>
        <div class="msgs" id="msgs">
            <div class="empty" id="empty"><span class="icon">💬</span><div>No messages yet</div></div>
        </div>
        <div class="typing" id="typing"><span id="typingText"></span><span class="dots"><span></span><span></span><span></span></span></div>
        <div class="composer">
            <div class="fp" id="fp"><span id="fname"></span><span class="rm" onclick="clearFile()">×</span></div>
            <div class="inner">
                <button class="attach" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" style="display:none" onchange="onFile(event)">
                <textarea id="msgInput" rows="1" placeholder="Message #general" onkeydown="onKey(event)"></textarea>
                <button class="send" id="sendBtn" onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <div class="rpanel" id="rpanel">
        <div class="title">Members — <span id="memberCount">0</span></div>
        <div id="memberList"></div>
    </div>
</div>

<div class="voice" id="voice">
    <div class="hd"><span class="title" id="vTitle">🔊 Voice</span><button class="close" onclick="leaveVoice()">✕</button></div>
    <div class="local" id="localVideoWrap"><video id="localVideo" autoplay muted playsinline></video></div>
    <div class="remote" id="remoteVideos"></div>
    <div class="parts" id="vParts"></div>
    <div class="ctrl">
        <button class="mute" id="muteBtn" onclick="toggleMute()">🔊 Mute</button>
        <button class="video" id="videoBtn" onclick="toggleVideo()">📹 Video</button>
        <button class="leave" onclick="leaveVoice()">📞 Leave</button>
    </div>
</div>

<div class="settings" id="settings">
    <div class="box">
        <div class="hd"><h2>⚙️ Settings</h2><button class="close" onclick="closeSettings()">×</button></div>
        <div class="grp"><label>Username</label><input type="text" id="setUser"></div>
        <div class="grp"><label>Avatar Color</label><input type="color" id="setColor"></div>
        <div class="grp"><label>Theme</label><select id="setTheme"><option value="dark">Dark</option><option value="light">Light</option></select></div>
        <div class="grp"><label>Notifications</label><select id="setNotif"><option value="all">All</option><option value="mentions">Mentions</option><option value="none">None</option></select></div>
        <div class="grp" style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn-save" onclick="saveSettings()">Save</button>
            <button class="btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>
</div>

<script>
// STATE
const S={token:null,user:null,channel:'general',type:'text',msgs:{},typing:{},socket:null,peers:{},stream:null,inVoice:false,muted:false,videoOn:false,file:null,online:new Set(),friends:[],requests:[]};

// DOM REFS
const $=id=>document.getElementById(id);
const auth=$('auth'),app=$('app'),authForm=$('authForm'),authBtn=$('authBtn'),authErr=$('authErr');
const authUser=$('authUser'),authPass=$('authPass'),switchLink=$('switchLink'),switchText=$('switchText');
const msgs=$('msgs'),empty=$('empty'),msgInput=$('msgInput'),sendBtn=$('sendBtn');
const chanName=$('chanName'),textChans=$('textChans'),voiceChans=$('voiceChans');
const memberList=$('memberList'),memberCount=$('memberCount'),rpanel=$('rpanel');
const voice=$('voice'),vTitle=$('vTitle'),vParts=$('vParts'),muteBtn=$('muteBtn'),videoBtn=$('videoBtn');
const localVideo=$('localVideo'),localVideoWrap=$('localVideoWrap'),remoteVideos=$('remoteVideos');
const typing=$('typing'),typingText=$('typingText'),fp=$('fp'),fname=$('fname'),fileInput=$('fileInput');
const navAv=$('navAv'),commName=$('commName'),settings=$('settings'),toasts=$('toasts');
const setUser=$('setUser'),setColor=$('setColor'),setTheme=$('setTheme'),setNotif=$('setNotif');

let isLogin=true;

// AUTH
switchLink.onclick=()=>{
    isLogin=!isLogin;
    authBtn.textContent=isLogin?'Sign In':'Sign Up';
    switchText.textContent=isLogin?"Don't have an account?":"Already have an account?";
    switchLink.textContent=isLogin?'Sign Up':'Sign In';
    authErr.textContent='';
};

authForm.onsubmit=async(e)=>{
    e.preventDefault();
    const u=authUser.value.trim(),p=authPass.value.trim();
    if(!u||!p){authErr.textContent='Please fill in all fields.';return}
    authBtn.disabled=true;authBtn.textContent='Loading...';authErr.textContent='';
    try{
        const ep=isLogin?'/api/auth/login':'/api/auth/register';
        const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||'Auth failed');
        S.token=d.token;S.user=d.user;
        localStorage.setItem('zenith_token',S.token);
        localStorage.setItem('zenith_user',JSON.stringify(S.user));
        toast('Welcome to Zenith!','success');
        initApp();
    }catch(err){authErr.textContent=err.message}
    authBtn.disabled=false;authBtn.textContent=isLogin?'Sign In':'Sign Up';
};

function checkAuth(){
    const t=localStorage.getItem('zenith_token'),u=localStorage.getItem('zenith_user');
    if(t&&u){S.token=t;S.user=JSON.parse(u);initApp();return true}
    return false;
}

// APP INIT
function initApp(){
    auth.classList.remove('active');app.classList.add('active');
    navAv.textContent=S.user.username.charAt(0).toUpperCase();
    navAv.style.background=S.user.avatarColor||'#7c3aed';
    connectSocket();
    loadChannels();
    loadMsgs('general');
    loadFriends();
}

// SOCKET
function connectSocket(){
    if(S.socket)return;
    const s=io({transports:['websocket','polling'],auth:{token:S.token}});
    s.on('connect',()=>{toast('Connected','success');s.emit('join',{channel:S.channel})});
    s.on('disconnect',()=>toast('Disconnected','error'));
    s.on('connect_error',()=>toast('Connection error','error'));
    s.on('message',(m)=>{
        if(!S.msgs[m.channel])S.msgs[m.channel]=[];
        S.msgs[m.channel].push(m);
        if(m.channel===S.channel)renderMsgs();
    });
    s.on('typing',({user,channel})=>{
        if(channel===S.channel){S.typing[user]=Date.now();updateTyping();setTimeout(updateTyping,1000)}
    });
    s.on('user_joined',({user,channel})=>{if(channel===S.channel){S.online.add(user.id);renderMembers();addSys(`${user.username} joined`)}});
    s.on('user_left',({user,channel})=>{if(channel===S.channel){S.online.delete(user.id);renderMembers();addSys(`${user.username} left`)}});
    s.on('presence_update',({userId,online})=>{online?S.online.add(userId):S.online.delete(userId);renderMembers()});
    s.on('voice_offer',handleOffer);
    s.on('voice_answer',handleAnswer);
    s.on('voice_ice',handleIce);
    s.on('voice_participants',updateParts);
    s.on('voice_user_joined',(d)=>{toast(`${d.username} joined voice`,'info');updateParts(d.participants)});
    s.on('voice_user_left',(d)=>{toast(`${d.username} left voice`,'info');updateParts(d.participants)});
    S.socket=s;
}

// MESSAGES
async function loadMsgs(channel){
    try{
        const r=await fetch(`/api/messages/${channel}`,{headers:{'Authorization':`Bearer ${S.token}`}});
        if(r.ok){const d=await r.json();S.msgs[channel]=d.messages||[];renderMsgs()}
    }catch(e){}
}

function renderMsgs(){
    const m=S.msgs[S.channel]||[];
    msgs.innerHTML='';
    if(m.length===0){msgs.appendChild(empty);return}
    empty.remove();
    m.forEach((msg,i)=>{
        const div=document.createElement('div');
        div.className='msg'+(msg.system?' system':'');
        if(msg.system){
            div.innerHTML=`<div class="body">${msg.content}</div>`;
        }else{
            const own=msg.userId===S.user?.id;
            const initial=msg.username?.charAt(0).toUpperCase()||'?';
            div.innerHTML=`
                <div class="av" style="background:${msg.avatarColor||'#7c3aed'}">${initial}</div>
                <div class="body">
                    <div class="hd">
                        <span class="un">${msg.username||'Unknown'}</span>
                        <span class="ts">${fmtTime(msg.createdAt)}</span>
                        ${msg.edited?'<span class="edited">(edited)</span>':''}
                        <div class="actions">
                            ${own?`<button onclick="editMsg('${msg.id}')">✏️</button>`:''}
                            ${own?`<button class="del" onclick="delMsg('${msg.id}')">🗑️</button>`:''}
                        </div>
                    </div>
                    <div class="txt">${fmtMsg(msg.content,msg.attachments)}</div>
                </div>
            `;
        }
        msgs.appendChild(div);
    });
    msgs.scrollTop=msgs.scrollHeight;
}

function fmtMsg(content,attachments){
    let h=esc(content);
    if(attachments){
        const files=Array.isArray(attachments)?attachments:[attachments];
        files.forEach(f=>{
            if(f.type?.startsWith('image/')){h+=`<br><img src="${f.url}" onclick="window.open('${f.url}')">`}
            else{h+=`<br><a href="${f.url}" target="_blank">📎 ${f.name}</a>`}
        });
    }
    return h;
}

function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function fmtTime(ts){if(!ts)return'Just now';return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function addSys(t){if(!S.msgs[S.channel])S.msgs[S.channel]=[];S.msgs[S.channel].push({system:true,content:t,createdAt:new Date().toISOString()});renderMsgs()}

async function sendMsg(){
    const t=msgInput.value.trim();
    if(!t&&!S.file)return;
    if(!S.socket?.connected){toast('Not connected','error');return}
    try{
        const r=await fetch('/api/messages',{
            method:'POST',
            headers:{'Authorization':`Bearer ${S.token}`,'Content-Type':'application/json'},
            body:JSON.stringify({channel:S.channel,content:t||'',attachments:S.file?[S.file]:undefined})
        });
        if(r.ok){msgInput.value='';msgInput.style.height='auto';clearFile()}else{const d=await r.json();toast(d.error||'Failed','error')}
    }catch(e){toast('Failed to send','error')}
}

async function delMsg(id){
    if(!confirm('Delete?'))return;
    try{
        const r=await fetch(`/api/messages/${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${S.token}`}});
        if(r.ok){S.msgs[S.channel]=S.msgs[S.channel].filter(m=>m.id!==id);renderMsgs()}
    }catch(e){toast('Failed to delete','error')}
}

function editMsg(id){toast('Edit feature coming soon','info')}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}}
msgInput.oninput=()=>{msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,120)+'px';if(msgInput.value.trim())S.socket?.emit('typing',{channel:S.channel})};

function updateTyping(){
    const now=Date.now();
    const t=Object.keys(S.typing).filter(u=>now-S.typing[u]<3000);
    if(t.length>0&&t.some(u=>u!==S.user?.username)){
        const n=t.filter(u=>u!==S.user?.username);
        typingText.textContent=n.length===1?`${n[0]} is typing...`:`${n.length} people are typing...`;
        typing.style.display='flex';
    }else{typing.style.display='none'}
}

// FILES
function onFile(e){
    const f=e.target.files[0];if(!f)return;
    if(f.size>10*1024*1024){toast('File too large (max 10MB)','error');return}
    S.file={name:f.name,type:f.type,size:f.size};
    fname.textContent=f.name;fp.classList.add('active');
    const r=new FileReader();
    r.onload=e=>{S.file.url=e.target.result};
    r.readAsDataURL(f);
}
function clearFile(){S.file=null;fp.classList.remove('active');fileInput.value=''}

// CHANNELS
async function loadChannels(){
    try{
        const r=await fetch('/api/channels',{headers:{'Authorization':`Bearer ${S.token}`}});
        if(r.ok){const d=await r.json();renderChans(d.channels||[])}
    }catch(e){}
}

function renderChans(channels){
    const t=channels.filter(c=>c.type==='text'||!c.type);
    const v=channels.filter(c=>c.type==='voice');
    textChans.innerHTML=t.map(c=>`<div class="chan ${c.name===S.channel?'active':''}" onclick="switchChan('${c.name}','text')"><span class="icon">#</span> ${c.name}</div>`).join('');
    voiceChans.innerHTML=v.map(c=>`<div class="chan ${c.name===S.channel?'active':''}" onclick="joinVoice('${c.name}')"><span class="icon">🔊</span> ${c.name}${c.active?'<span class="vi">●</span>':''}</div>`).join('');
}

function switchChan(name,type){
    S.channel=name;S.type=type||'text';chanName.textContent=name;
    S.socket?.emit('join',{channel:name});
    loadMsgs(name);
    document.getElementById('csidebar')?.classList.remove('mobile');
}

async function createChan(type){
    const name=prompt(`Enter ${type} channel name:`);if(!name)return;
    try{
        const r=await fetch('/api/channels',{method:'POST',headers:{'Authorization':`Bearer ${S.token}`,'Content-Type':'application/json'},body:JSON.stringify({name,type})});
        if(r.ok){toast(`Channel #${name} created`,'success');loadChannels()}else{const d=await r.json();toast(d.error||'Failed','error')}
    }catch(e){toast('Failed to create channel','error')}
}

// VOICE
async function joinVoice(name){
    if(S.inVoice)leaveVoice();
    S.channel=name;S.type='voice';chanName.textContent=name;vTitle.textContent=`🔊 ${name}`;
    try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
        S.stream=stream;S.inVoice=true;S.muted=false;
        voice.classList.add('active');
        muteBtn.textContent='🔊 Mute';muteBtn.classList.remove('active');
        S.socket?.emit('join_voice',{channel:name});
        toast(`Joined ${name}`,'success');
    }catch(e){toast('Could not access microphone','error')}
}

function leaveVoice(){
    if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}
    S.inVoice=false;S.muted=false;S.videoOn=false;
    voice.classList.remove('active');
    localVideoWrap.classList.remove('active');
    remoteVideos.innerHTML='';
    S.socket?.emit('leave_voice',{channel:S.channel});
    Object.values(S.peers).forEach(p=>p.close());S.peers={};
}

function toggleMute(){
    if(!S.stream)return;
    S.muted=!S.muted;
    S.stream.getAudioTracks().forEach(t=>t.enabled=!S.muted);
    muteBtn.textContent=S.muted?'🔇 Unmute':'🔊 Mute';
    muteBtn.classList.toggle('active',S.muted);
}

async function toggleVideo(){
    if(!S.inVoice){toast('Join a voice channel first','info');return}
    S.videoOn=!S.videoOn;
    if(S.videoOn){
        try{
            const stream=await navigator.mediaDevices.getUserMedia({video:true});
            S.stream.getVideoTracks().forEach(t=>t.stop());
            S.stream.addTrack(stream.getVideoTracks()[0]);
            localVideo.srcObject=S.stream;
            localVideoWrap.classList.add('active');
            videoBtn.textContent='📹 Stop Video';
            videoBtn.classList.add('active');
        }catch(e){toast('Could not access camera','error');S.videoOn=false}
    }else{
        S.stream.getVideoTracks().forEach(t=>t.stop());
        const audio=S.stream.getAudioTracks();
        const ns=new MediaStream();audio.forEach(t=>ns.addTrack(t));
        S.stream=ns;
        localVideoWrap.classList.remove('active');
        videoBtn.textContent='📹 Video';
        videoBtn.classList.remove('active');
    }
}

function handleOffer({from,offer,channel}){
    const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    S.peers[from]=pc;
    pc.onicecandidate=e=>{if(e.candidate)S.socket?.emit('voice_ice',{to:from,candidate:e.candidate,channel})};
    pc.ontrack=e=>{
        const v=document.createElement('video');
        v.srcObject=e.streams[0];v.autoplay=true;v.playsInline=true;v.id=`remote-${from}`;
        remoteVideos.appendChild(v);
    };
    pc.setRemoteDescription(new RTCSessionDescription(offer))
        .then(()=>pc.createAnswer())
        .then(a=>pc.setLocalDescription(a))
        .then(()=>S.socket?.emit('voice_answer',{to:from,answer:pc.localDescription,channel}));
}

function handleAnswer({from,answer,channel}){const pc=S.peers[from];if(pc)pc.setRemoteDescription(new RTCSessionDescription(answer))}
function handleIce({from,candidate,channel}){const pc=S.peers[from];if(pc)pc.addIceCandidate(new RTCIceCandidate(candidate))}

function updateParts(participants){
    vParts.innerHTML=participants.map(p=>`
        <div class="part">
            <div class="av" style="background:${p.avatarColor||'#7c3aed'}">${p.username?.charAt(0).toUpperCase()||'?'}${p.speaking?'<div class="ring"></div>':''}</div>
            <span class="name">${p.username||'Unknown'}</span>
        </div>
    `).join('');
}

// MEMBERS
function renderMembers(){
    const count=S.online.size||0;
    memberCount.textContent=count||'0';
    memberList.innerHTML=Array.from(S.online).map(id=>`
        <div class="member">
            <div class="av" style="background:#7c3aed">${id.slice(0,2).toUpperCase()}</div>
            <span class="name">User ${id.slice(0,6)}</span>
            <span class="dot online"></span>
        </div>
    `).join('')||'<div style="color:var(--text3);font-size:13px;padding:8px;">No members online</div>';
}

function toggleMembers(){rpanel.classList.toggle('active')}
function toggleMobile(){document.getElementById('csidebar')?.classList.toggle('mobile')}

// NAVIGATION
function navigate(section){
    document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'));
    const map={home:'navHome',friends:'navFriends',dms:'navDMs'};
    if(map[section])$(map[section])?.classList.add('active');
    if(section==='friends'){toast('Friends feature - manage friends','info')}
    else if(section==='dms'){toast('Direct Messages - coming soon','info')}
    else{switchChan('general','text')}
}

// FRIENDS
async function loadFriends(){
    try{
        const r=await fetch('/api/friends',{headers:{'Authorization':`Bearer ${S.token}`}});
        if(r.ok){const d=await r.json();S.friends=d.friends||[];S.requests=d.requests||[]}
    }catch(e){}
}

// SETTINGS
function openSettings(){
    if(S.user){setUser.value=S.user.username||'';setColor.value=S.user.avatarColor||'#7c3aed'}
    settings.classList.add('active');
}
function closeSettings(){settings.classList.remove('active')}
async function saveSettings(){
    const u=setUser.value.trim(),c=setColor.value,t=setTheme.value,n=setNotif.value;
    try{
        const r=await fetch('/api/users/profile',{
            method:'PUT',
            headers:{'Authorization':`Bearer ${S.token}`,'Content-Type':'application/json'},
            body:JSON.stringify({username:u,avatarColor:c,theme:t,notifications:n})
        });
        if(r.ok){const d=await r.json();S.user=d.user;localStorage.setItem('zenith_user',JSON.stringify(S.user));navAv.style.background=c;toast('Settings saved!','success');closeSettings()}
        else{const d=await r.json();toast(d.error||'Failed','error')}
    }catch(e){toast('Failed to save settings','error')}
}

// LOGOUT
function logout(){
    if(S.socket){S.socket.disconnect();S.socket=null}
    if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}
    localStorage.removeItem('zenith_token');localStorage.removeItem('zenith_user');
    S.token=null;S.user=null;
    app.classList.remove('active');auth.classList.add('active');
    voice.classList.remove('active');
    toast('Logged out','info');
}

// TOASTS
function toast(msg,type='info'){
    const t=document.createElement('div');
    t.className=`toast ${type}`;t.textContent=msg;
    toasts.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(100%)';setTimeout(()=>t.remove(),300)},4000);
}

// INIT
if(!checkAuth())auth.classList.add('active');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings()});
settings.addEventListener('click',e=>{if(e.target===settings)closeSettings()});

console.log('🚀 Zenith loaded');
console.log('ℹ️ Owner: zenith / zenith123!');
</script>
