<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zenith - Communication Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --bg-card: #1e1e32;
            --bg-hover: #2a2a42;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a82;
            --accent: #7c3aed;
            --accent-hover: #8b5cf6;
            --accent-light: #a78bfa;
            --accent-dark: #5b21b6;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --border: #2a2a42;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

        /* Auth Screen */
        #auth-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 999;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
        }
        #auth-screen.active { display: flex; }
        .auth-container {
            background: var(--bg-card);
            padding: 48px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .auth-container .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .auth-container .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .auth-container .form-group {
            margin-bottom: 16px;
        }
        .auth-container label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .auth-container input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 15px;
            transition: var(--transition);
        }
        .auth-container input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }
        .auth-container .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        .auth-container .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .auth-container .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .auth-container .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .auth-container .auth-switch a {
            color: var(--accent-light);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-container .auth-switch a:hover { color: var(--accent); }
        .auth-container .error-msg {
            color: var(--red);
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            min-height: 20px;
        }
        .auth-container .download-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .auth-container .download-buttons .btn-download {
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .auth-container .download-buttons .btn-download:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* Main App */
        #app {
            display: none;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #app.active { display: flex; }

        /* Sidebar */
        .sidebar {
            width: 72px;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 8px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            overflow-y: auto;
            z-index: 10;
        }
        .sidebar .logo-icon {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .sidebar .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .sidebar .nav-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar .nav-btn.active { background: var(--accent); color: white; border-radius: 16px; }
        .sidebar .nav-btn .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background: var(--red);
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .sidebar .nav-btn .avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }
        .sidebar .nav-divider {
            width: 32px;
            height: 2px;
            background: var(--border);
            border-radius: 1px;
            margin: 4px 0;
        }
        .sidebar .bottom-nav {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        /* Community Sidebar */
        .community-sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .community-sidebar .header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 60px;
            cursor: pointer;
        }
        .community-sidebar .header:hover { background: var(--bg-hover); }
        .community-sidebar .header .chevron { font-size: 12px; color: var(--text-muted); }
        .community-sidebar .section {
            padding: 12px 8px;
            overflow-y: auto;
            flex: 1;
        }
        .community-sidebar .section-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 12px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .community-sidebar .section-label .add-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .community-sidebar .section-label .add-btn:hover { color: var(--text-primary); }
        .community-sidebar .channel-item {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .community-sidebar .channel-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .community-sidebar .channel-item.active { background: var(--bg-tertiary); color: var(--text-primary); }
        .community-sidebar .channel-item .channel-icon { font-size: 16px; opacity: 0.6; }
        .community-sidebar .channel-item .voice-indicator {
            margin-left: auto;
            font-size: 12px;
            color: var(--green);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-primary);
        }
        .main-content .channel-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 60px;
            background: var(--bg-secondary);
        }
        .main-content .channel-header .channel-name {
            font-size: 18px;
            font-weight: 600;
        }
        .main-content .channel-header .channel-name .hash { color: var(--text-muted); font-weight: 400; }
        .main-content .channel-header .header-actions {
            display: flex;
            gap: 8px;
        }
        .main-content .channel-header .header-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .main-content .channel-header .header-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .messages-container .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin: auto;
            font-size: 14px;
        }
        .messages-container .empty-state .icon { font-size: 48px; margin-bottom: 12px; display: block; }
        .message {
            display: flex;
            gap: 12px;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .message:hover { background: var(--bg-tertiary); }
        .message .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }
        .message .msg-content { flex: 1; min-width: 0; }
        .message .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .message .msg-header .username {
            font-weight: 600;
            font-size: 14px;
        }
        .message .msg-header .timestamp {
            font-size: 11px;
            color: var(--text-muted);
        }
        .message .msg-body {
            font-size: 15px;
            word-wrap: break-word;
            margin-top: 2px;
            line-height: 1.5;
        }
        .message .msg-body img {
            max-width: 300px;
            max-height: 300px;
            border-radius: var(--radius-sm);
            margin-top: 4px;
            cursor: pointer;
        }
        .message .msg-actions {
            display: none;
            gap: 4px;
            margin-left: auto;
        }
        .message:hover .msg-actions { display: flex; }
        .message .msg-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .message .msg-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .message .msg-actions .delete-btn:hover { color: var(--red); }
        .message .edited-tag { font-size: 11px; color: var(--text-muted); font-style: italic; }
        .message.system-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 8px;
            justify-content: center;
        }
        .message.system-msg .msg-avatar { display: none; }
        .message.system-msg .msg-content { text-align: center; }

        /* Typing Indicator */
        .typing-indicator {
            padding: 4px 24px 8px;
            font-size: 13px;
            color: var(--text-muted);
            min-height: 28px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .typing-indicator .dots span {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
            margin: 0 2px;
            animation: typingDot 1.4s infinite;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Message Composer */
        .composer {
            padding: 12px 24px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }
        .composer .composer-inner {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            padding: 4px 12px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .composer .composer-inner:focus-within { border-color: var(--accent); }
        .composer .composer-inner .attach-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
            padding: 8px 4px;
        }
        .composer .composer-inner .attach-btn:hover { color: var(--text-primary); }
        .composer .composer-inner textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            padding: 10px 0;
            font-size: 15px;
            resize: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 120px;
            outline: none;
        }
        .composer .composer-inner textarea::placeholder { color: var(--text-muted); }
        .composer .composer-inner .send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
            margin-bottom: 4px;
            white-space: nowrap;
        }
        .composer .composer-inner .send-btn:hover { background: var(--accent-hover); }
        .composer .composer-inner .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .composer .file-preview {
            display: none;
            padding: 8px 0;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .composer .file-preview.active { display: flex; }
        .composer .file-preview .remove-file {
            cursor: pointer;
            color: var(--red);
            font-weight: 700;
        }

        /* Right Panel */
        .right-panel {
            width: 240px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
            display: none;
        }
        .right-panel.active { display: block; }
        .right-panel .panel-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .right-panel .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: pointer;
        }
        .right-panel .member-item:hover { background: var(--bg-hover); }
        .right-panel .member-item .member-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }
        .right-panel .member-item .member-name {
            font-size: 14px;
            flex: 1;
        }
        .right-panel .member-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .right-panel .member-item .status-dot.online { background: var(--green); }
        .right-panel .member-item .status-dot.offline { background: var(--text-muted); }

        /* Voice/Video UI */
        .voice-ui {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 32px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 100;
            min-width: 320px;
            backdrop-filter: blur(12px);
        }
        .voice-ui.active { display: block; }
        .voice-ui .voice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .voice-ui .voice-header .voice-title {
            font-weight: 600;
            font-size: 16px;
        }
        .voice-ui .voice-header .voice-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
        }
        .voice-ui .voice-participants {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            justify-content: center;
        }
        .voice-ui .voice-participant {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            min-width: 60px;
        }
        .voice-ui .voice-participant .vp-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            position: relative;
        }
        .voice-ui .voice-participant .vp-avatar .speaking-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 3px solid var(--green);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }
        .voice-ui .voice-participant .vp-name { font-size: 12px; color: var(--text-secondary); }
        .voice-ui .voice-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .voice-ui .voice-controls button {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            background: var(--bg-secondary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .voice-ui .voice-controls button:hover { background: var(--bg-hover); }
        .voice-ui .voice-controls button.mute-btn.active { background: var(--red); color: white; }
        .voice-ui .voice-controls button.video-btn.active { background: var(--green); color: white; }
        .voice-ui .voice-controls button.leave-btn { background: var(--red); color: white; }
        .voice-ui .voice-controls button.leave-btn:hover { background: #dc2626; }
        .voice-ui .local-video {
            width: 160px;
            height: 120px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            margin: 8px auto;
            display: none;
            overflow: hidden;
        }
        .voice-ui .local-video.active { display: block; }
        .voice-ui .local-video video { width: 100%; height: 100%; object-fit: cover; }
        .voice-ui .remote-videos {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 8px;
        }
        .voice-ui .remote-videos video {
            width: 120px;
            height: 90px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            object-fit: cover;
        }

        /* Settings Modal */
        .settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .settings-modal.active { display: flex; }
        .settings-modal .settings-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .settings-modal .settings-content .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .settings-modal .settings-content .settings-header h2 {
            font-size: 24px;
            font-weight: 700;
        }
        .settings-modal .settings-content .settings-header .close-settings {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
        }
        .settings-modal .settings-content .settings-header .close-settings:hover { color: var(--text-primary); }
        .settings-modal .settings-content .setting-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .settings-modal .settings-content .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .settings-modal .settings-content .setting-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .settings-modal .settings-content .setting-group input,
        .settings-modal .settings-content .setting-group select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
        }
        .settings-modal .settings-content .setting-group input:focus,
        .settings-modal .settings-content .setting-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .settings-modal .settings-content .setting-group .btn-danger {
            padding: 8px 20px;
            background: var(--red);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .settings-modal .settings-content .setting-group .btn-danger:hover { background: #dc2626; }
        .settings-modal .settings-content .setting-group .btn-save {
            padding: 8px 20px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .settings-modal .settings-content .setting-group .btn-save:hover { background: var(--accent-hover); }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 14px;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
            max-width: 360px;
        }
        .toast.error { border-left: 4px solid var(--red); }
        .toast.success { border-left: 4px solid var(--green); }
        .toast.info { border-left: 4px solid var(--accent); }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .right-panel { display: none !important; }
            .community-sidebar { width: 200px; }
        }
        @media (max-width: 768px) {
            .sidebar { width: 56px; padding: 12px 0; }
            .sidebar .nav-btn { width: 40px; height: 40px; font-size: 16px; }
            .community-sidebar { display: none; }
            .community-sidebar.mobile-active {
                display: flex;
                position: fixed;
                left: 56px;
                top: 0;
                bottom: 0;
                width: 260px;
                z-index: 50;
                box-shadow: var(--shadow);
            }
            .main-content .channel-header { padding: 12px 16px; }
            .messages-container { padding: 12px 16px; }
            .composer { padding: 8px 16px 16px; }
            .auth-container { padding: 24px; margin: 16px; }
            .voice-ui {
                min-width: auto;
                width: 90%;
                bottom: 70px;
                padding: 16px;
            }
            .voice-ui .voice-participant .vp-avatar { width: 36px; height: 36px; }
        }
        @media (max-width: 480px) {
            .sidebar { width: 48px; }
            .sidebar .nav-btn { width: 36px; height: 36px; font-size: 14px; }
            .message .msg-avatar { width: 28px; height: 28px; font-size: 12px; }
            .message .msg-body { font-size: 14px; }
            .composer .composer-inner textarea { font-size: 14px; min-height: 36px; }
            .composer .composer-inner .send-btn { padding: 6px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="active">
        <div class="auth-container">
            <div class="logo">ZENITH</div>
            <div class="subtitle">Connect. Communicate. Create.</div>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label for="authUsername">Username</label>
                    <input type="text" id="authUsername" placeholder="Enter your username" required />
                </div>
                <div class="form-group">
                    <label for="authPassword">Password</label>
                    <input type="password" id="authPassword" placeholder="Enter your password" required />
                </div>
                <div class="error-msg" id="authError"></div>
                <button type="submit" class="btn-primary" id="authBtn">Sign In</button>
                <div class="auth-switch">
                    <span id="authSwitchText">Don't have an account?</span>
                    <a id="authSwitchLink">Sign Up</a>
                </div>
            </form>
            <div class="download-buttons">
                <a href="#" class="btn-download">Windows</a>
                <a href="#" class="btn-download">macOS</a>
                <a href="#" class="btn-download">Linux</a>
                <a href="#" class="btn-download">Web</a>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="logo-icon" onclick="navigateTo('home')">Z</div>
            <button class="nav-btn active" id="navHome" onclick="navigateTo('home')" title="Home">🏠</button>
            <button class="nav-btn" id="navFriends" onclick="navigateTo('friends')" title="Friends">👥</button>
            <button class="nav-btn" id="navDMs" onclick="navigateTo('dms')" title="Direct Messages">💬</button>
            <div class="nav-divider"></div>
            <button class="nav-btn" id="navSettings" onclick="openSettings()" title="Settings">⚙️</button>
            <div class="bottom-nav">
                <button class="nav-btn" onclick="logout()" title="Logout">🚪</button>
                <div class="nav-btn" id="userAvatar" title="Profile">
                    <div class="avatar-small" id="navAvatar">Z</div>
                </div>
            </div>
        </div>

        <!-- Community Sidebar -->
        <div class="community-sidebar" id="communitySidebar">
            <div class="header" onclick="toggleCommunityMenu()">
                <span id="communityName">Zenith</span>
                <span class="chevron">▼</span>
            </div>
            <div class="section" id="channelList">
                <div class="section-label">
                    <span>Text Channels</span>
                    <button class="add-btn" onclick="createChannel('text')" title="Create Channel">+</button>
                </div>
                <div id="textChannels"></div>
                <div class="section-label" style="margin-top:12px;">
                    <span>Voice Channels</span>
                    <button class="add-btn" onclick="createChannel('voice')" title="Create Channel">+</button>
                </div>
                <div id="voiceChannels"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="channel-header">
                <div class="channel-name" id="currentChannel">
                    <span class="hash">#</span> <span id="channelName">general</span>
                </div>
                <div class="header-actions">
                    <button onclick="toggleRightPanel()" title="Members">👥</button>
                    <button onclick="toggleMobileSidebar()" title="Channels" id="mobileChannelBtn">☰</button>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <span class="icon">💬</span>
                    <div>No messages yet</div>
                    <div style="font-size:13px;margin-top:4px;">Be the first to say something!</div>
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span id="typingText"></span>
                <span class="dots"><span></span><span></span><span></span></span>
            </div>
            <div class="composer">
                <div class="file-preview" id="filePreview">
                    <span id="fileName">file.txt</span>
                    <span class="remove-file" onclick="clearFileAttachment()">×</span>
                </div>
                <div class="composer-inner">
                    <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                    <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)" />
                    <textarea id="messageInput" rows="1" placeholder="Message #general" onkeydown="handleKeyDown(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel" id="rightPanel">
            <div class="panel-title">Members — <span id="memberCount">0</span></div>
            <div id="memberList"></div>
        </div>
    </div>

    <!-- Voice UI -->
    <div class="voice-ui" id="voiceUI">
        <div class="voice-header">
            <span class="voice-title" id="voiceChannelName">🔊 Voice Channel</span>
            <button class="voice-close" onclick="leaveVoiceChannel()">✕</button>
        </div>
        <div class="local-video" id="localVideoContainer">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div class="remote-videos" id="remoteVideos"></div>
        <div class="voice-participants" id="voiceParticipants"></div>
        <div class="voice-controls">
            <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊 Mute</button>
            <button class="video-btn" id="videoBtn" onclick="toggleVideo()">📹 Video</button>
            <button class="leave-btn" onclick="leaveVoiceChannel()">📞 Leave</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">
                <h2>⚙️ Settings</h2>
                <button class="close-settings" onclick="closeSettings()">×</button>
            </div>
            <div class="setting-group">
                <label>Username</label>
                <input type="text" id="settingsUsername" />
            </div>
            <div class="setting-group">
                <label>Avatar Color</label>
                <input type="color" id="settingsAvatarColor" />
            </div>
            <div class="setting-group">
                <label>Theme</label>
                <select id="settingsTheme">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Notifications</label>
                <select id="settingsNotifications">
                    <option value="all">All Messages</option>
                    <option value="mentions">Mentions Only</option>
                    <option value="none">None</option>
                </select>
            </div>
            <div class="setting-group" style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn-save" onclick="saveSettings()">Save Settings</button>
                <button class="btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        // ============ STATE ============
        const state = {
            token: null,
            user: null,
            currentChannel: 'general',
            currentChannelType: 'text',
            currentCommunity: 'zenith',
            messages: {},
            typingUsers: {},
            socket: null,
            peerConnections: {},
            localStream: null,
            remoteStreams: {},
            inVoiceChannel: false,
            isMuted: false,
            isVideoOn: false,
            fileAttachment: null,
            isMobile: window.innerWidth <= 768,
            friends: [],
            friendRequests: [],
            onlineUsers: new Set(),
        };

        // ============ DOM REFS ============
        const $ = id => document.getElementById(id);
        const authScreen = $('auth-screen');
        const app = $('app');
        const authForm = $('authForm');
        const authBtn = $('authBtn');
        const authError = $('authError');
        const authSwitchLink = $('authSwitchLink');
        const authSwitchText = $('authSwitchText');
        const messagesContainer = $('messagesContainer');
        const emptyState = $('emptyState');
        const messageInput = $('messageInput');
        const sendBtn = $('sendBtn');
        const channelName = $('channelName');
        const currentChannel = $('currentChannel');
        const textChannels = $('textChannels');
        const voiceChannels = $('voiceChannels');
        const memberList = $('memberList');
        const memberCount = $('memberCount');
        const rightPanel = $('rightPanel');
        const voiceUI = $('voiceUI');
        const voiceChannelName = $('voiceChannelName');
        const voiceParticipants = $('voiceParticipants');
        const muteBtn = $('muteBtn');
        const videoBtn = $('videoBtn');
        const localVideo = $('localVideo');
        const localVideoContainer = $('localVideoContainer');
        const remoteVideos = $('remoteVideos');
        const typingIndicator = $('typingIndicator');
        const typingText = $('typingText');
        const filePreview = $('filePreview');
        const fileName = $('fileName');
        const fileInput = $('fileInput');
        const navAvatar = $('navAvatar');
        const communityName = $('communityName');
        const toastContainer = $('toastContainer');
        const settingsModal = $('settingsModal');

        // ============ AUTH ============
        let isLogin = true;

        authSwitchLink.addEventListener('click', () => {
            isLogin = !isLogin;
            authBtn.textContent = isLogin ? 'Sign In' : 'Sign Up';
            authSwitchText.textContent = isLogin ? "Don't have an account?" : "Already have an account?";
            authSwitchLink.textContent = isLogin ? 'Sign Up' : 'Sign In';
            authError.textContent = '';
        });

        async function handleAuth(e) {
            e.preventDefault();
            const username = $('authUsername').value.trim();
            const password = $('authPassword').value.trim();
            if (!username || !password) { authError.textContent = 'Please fill in all fields.'; return; }

            authBtn.disabled = true;
            authBtn.textContent = 'Loading...';
            authError.textContent = '';

            try {
                const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Authentication failed');

                state.token = data.token;
                state.user = data.user;
                localStorage.setItem('zenith_token', state.token);
                localStorage.setItem('zenith_user', JSON.stringify(state.user));
                showToast('Welcome to Zenith!', 'success');
                initializeApp();
            } catch (err) {
                authError.textContent = err.message || 'Something went wrong.';
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = isLogin ? 'Sign In' : 'Sign Up';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('zenith_token');
            const user = localStorage.getItem('zenith_user');
            if (token && user) {
                state.token = token;
                state.user = JSON.parse(user);
                initializeApp();
                return true;
            }
            return false;
        }

        // ============ APP INIT ============
        function initializeApp() {
            authScreen.classList.remove('active');
            app.classList.add('active');
            updateNavAvatar();
            connectSocket();
            loadChannels();
            loadMessages('general');
            loadFriends();
            checkMobile();
            window.addEventListener('resize', checkMobile);
        }

        function updateNavAvatar() {
            if (state.user) {
                const initial = state.user.username.charAt(0).toUpperCase();
                navAvatar.textContent = initial;
                navAvatar.style.background = state.user.avatarColor || '#7c3aed';
            }
        }

        // ============ SOCKET.IO ============
        function connectSocket() {
            if (state.socket) return;
            const socket = io({
                transports: ['websocket', 'polling'],
                auth: { token: state.token }
            });

            socket.on('connect', () => {
                showToast('Connected to server', 'success');
                socket.emit('join', { channel: state.currentChannel });
            });

            socket.on('disconnect', () => showToast('Disconnected from server', 'error'));
            socket.on('connect_error', () => showToast('Connection error', 'error'));

            socket.on('message', (msg) => {
                if (!state.messages[msg.channel]) state.messages[msg.channel] = [];
                state.messages[msg.channel].push(msg);
                if (msg.channel === state.currentChannel) renderMessages();
            });

            socket.on('typing', ({ user, channel }) => {
                if (channel === state.currentChannel) {
                    state.typingUsers[user] = Date.now();
                    updateTypingIndicator();
                    setTimeout(() => updateTypingIndicator(), 1000);
                }
            });

            socket.on('user_joined', ({ user, channel }) => {
                if (channel === state.currentChannel) {
                    state.onlineUsers.add(user.id);
                    renderMembers();
                    addSystemMessage(`${user.username} joined`);
                }
            });

            socket.on('user_left', ({ user, channel }) => {
                if (channel === state.currentChannel) {
                    state.onlineUsers.delete(user.id);
                    renderMembers();
                    addSystemMessage(`${user.username} left`);
                }
            });

            socket.on('presence_update', ({ userId, online }) => {
                if (online) state.onlineUsers.add(userId);
                else state.onlineUsers.delete(userId);
                renderMembers();
            });

            // Voice signaling
            socket.on('voice_offer', handleVoiceOffer);
            socket.on('voice_answer', handleVoiceAnswer);
            socket.on('voice_ice', handleVoiceIce);
            socket.on('voice_participants', updateVoiceParticipants);
            socket.on('voice_user_joined', (data) => {
                showToast(`${data.username} joined voice`, 'info');
                updateVoiceParticipants(data.participants);
            });
            socket.on('voice_user_left', (data) => {
                showToast(`${data.username} left voice`, 'info');
                updateVoiceParticipants(data.participants);
            });

            state.socket = socket;
        }

        // ============ MESSAGES ============
        async function loadMessages(channel) {
            try {
                const res = await fetch(`/api/messages/${channel}`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    state.messages[channel] = data.messages || [];
                    renderMessages();
                }
            } catch (err) {
                console.error('Failed to load messages:', err);
            }
        }

        function renderMessages() {
            const msgs = state.messages[state.currentChannel] || [];
            messagesContainer.innerHTML = '';
            if (msgs.length === 0) {
                messagesContainer.appendChild(emptyState);
                return;
            }
            emptyState.remove();

            msgs.forEach((msg, idx) => {
                const div = document.createElement('div');
                div.className = 'message' + (msg.system ? ' system-msg' : '');
                if (msg.system) {
                    div.innerHTML = `<div class="msg-content">${msg.content}</div>`;
                } else {
                    const isOwn = msg.userId === state.user?.id;
                    const initial = msg.username?.charAt(0).toUpperCase() || '?';
                    div.innerHTML = `
                        <div class="msg-avatar" style="background:${msg.avatarColor || '#7c3aed'}">${initial}</div>
                        <div class="msg-content">
                            <div class="msg-header">
                                <span class="username">${msg.username || 'Unknown'}</span>
                                <span class="timestamp">${formatTime(msg.createdAt)}</span>
                                ${msg.edited ? '<span class="edited-tag">(edited)</span>' : ''}
                                <div class="msg-actions">
                                    ${isOwn ? `<button onclick="editMessage('${msg.id}')">✏️</button>` : ''}
                                    ${isOwn ? `<button class="delete-btn" onclick="deleteMessage('${msg.id}')">🗑️</button>` : ''}
                                </div>
                            </div>
                            <div class="msg-body">${formatMessage(msg.content, msg.attachments)}</div>
                        </div>
                    `;
                }
                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function formatMessage(content, attachments) {
            let html = escapeHtml(content);
            if (attachments) {
                const files = Array.isArray(attachments) ? attachments : [attachments];
                files.forEach(f => {
                    if (f.type?.startsWith('image/')) {
                        html += `<br><img src="${f.url}" alt="Image" onclick="window.open('${f.url}')" />`;
                    } else {
                        html += `<br><a href="${f.url}" target="_blank">📎 ${f.name}</a>`;
                    }
                });
            }
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(ts) {
            if (!ts) return 'Just now';
            const d = new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addSystemMessage(text) {
            if (!state.messages[state.currentChannel]) state.messages[state.currentChannel] = [];
            state.messages[state.currentChannel].push({
                system: true,
                content: text,
                createdAt: new Date().toISOString()
            });
            renderMessages();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !state.fileAttachment) return;
            if (!state.socket?.connected) { showToast('Not connected to server', 'error'); return; }

            const msg = {
                channel: state.currentChannel,
                content: text || '',
                attachments: state.fileAttachment ? [state.fileAttachment] : undefined
            };

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(msg)
                });
                if (res.ok) {
                    messageInput.value = '';
                    messageInput.style.height = 'auto';
                    clearFileAttachment();
                    // Socket will broadcast the message
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Failed to send', 'error');
                }
            } catch (err) {
                showToast('Failed to send message', 'error');
            }
        }

        async function deleteMessage(id) {
            if (!confirm('Delete this message?')) return;
            try {
                const res = await fetch(`/api/messages/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                if (res.ok) {
                    const msgs = state.messages[state.currentChannel] || [];
                    state.messages[state.currentChannel] = msgs.filter(m => m.id !== id);
                    renderMessages();
                }
            } catch (err) {
                showToast('Failed to delete', 'error');
            }
        }

        function editMessage(id) {
            const msgs = state.messages[state.currentChannel] || [];
            const msg = msgs.find(m => m.id === id);
            if (!msg) return;
            const newContent = prompt('Edit message:', msg.content);
            if (newContent === null || newContent === msg.content) return;
            // This would need a PUT endpoint - simplified for demo
            showToast('Edit feature requires server endpoint', 'info');
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
            if (messageInput.value.trim()) {
                state.socket?.emit('typing', { channel: state.currentChannel });
            }
        });

        function updateTypingIndicator() {
            const now = Date.now();
            const typing = Object.keys(state.typingUsers).filter(u => now - state.typingUsers[u] < 3000);
            if (typing.length > 0 && typing.some(u => u !== state.user?.username)) {
                const names = typing.filter(u => u !== state.user?.username);
                typingText.textContent = names.length === 1 ? `${names[0]} is typing...` : `${names.length} people are typing...`;
                typingIndicator.style.display = 'flex';
            } else {
                typingIndicator.style.display = 'none';
            }
        }

        // ============ FILE ATTACHMENTS ============
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 10 * 1024 * 1024) {
                showToast('File too large (max 10MB)', 'error');
                return;
            }
            state.fileAttachment = {
                name: file.name,
                type: file.type,
                size: file.size
            };
            fileName.textContent = file.name;
            filePreview.classList.add('active');
            // In a real implementation, upload to server
            // For demo, we'll use data URL
            const reader = new FileReader();
            reader.onload = (e) => {
                state.fileAttachment.url = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearFileAttachment() {
            state.fileAttachment = null;
            filePreview.classList.remove('active');
            fileInput.value = '';
        }

        // ============ CHANNELS ============
        async function loadChannels() {
            try {
                const res = await fetch('/api/channels', {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    renderChannels(data.channels || []);
                }
            } catch (err) {
                console.error('Failed to load channels:', err);
            }
        }

        function renderChannels(channels) {
            const text = channels.filter(c => c.type === 'text' || !c.type);
            const voice = channels.filter(c => c.type === 'voice');

            textChannels.innerHTML = text.map(c => `
                <div class="channel-item ${c.name === state.currentChannel ? 'active' : ''}" onclick="switchChannel('${c.name}', 'text')">
                    <span class="channel-icon">#</span> ${c.name}
                </div>
            `).join('');

            voiceChannels.innerHTML = voice.map(c => `
                <div class="channel-item ${c.name === state.currentChannel ? 'active' : ''}" onclick="joinVoiceChannel('${c.name}')">
                    <span class="channel-icon">🔊</span> ${c.name}
                    <span class="voice-indicator">${c.active ? '●' : ''}</span>
                </div>
            `).join('');
        }

        function switchChannel(name, type) {
            state.currentChannel = name;
            state.currentChannelType = type || 'text';
            channelName.textContent = name;
            if (state.socket) {
                state.socket.emit('join', { channel: name });
            }
            loadMessages(name);
            renderChannels([...document.querySelectorAll('.channel-item')].map(el => ({
                name: el.textContent.trim(),
                type: el.querySelector('.channel-icon')?.textContent === '🔊' ? 'voice' : 'text'
            })));
            // Close mobile sidebar
            document.getElementById('communitySidebar')?.classList.remove('mobile-active');
        }

        async function createChannel(type) {
            const name = prompt(`Enter ${type} channel name:`);
            if (!name) return;
            try {
                const res = await fetch('/api/channels', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, type })
                });
                if (res.ok) {
                    showToast(`Channel #${name} created`, 'success');
                    loadChannels();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Failed to create channel', 'error');
                }
            } catch (err) {
                showToast('Failed to create channel', 'error');
            }
        }

        // ============ VOICE/VIDEO ============
        async function joinVoiceChannel(name) {
            if (state.inVoiceChannel) {
                leaveVoiceChannel();
                await new Promise(r => setTimeout(r, 500));
            }

            state.currentChannel = name;
            state.currentChannelType = 'voice';
            channelName.textContent = name;
            voiceChannelName.textContent = `🔊 ${name}`;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                state.localStream = stream;
                state.inVoiceChannel = true;
                state.isMuted = false;

                voiceUI.classList.add('active');
                muteBtn.textContent = '🔊 Mute';
                muteBtn.classList.remove('active');

                state.socket?.emit('join_voice', { channel: name });

                showToast(`Joined ${name}`, 'success');
            } catch (err) {
                showToast('Could not access microphone', 'error');
                console.error(err);
            }
        }

        function leaveVoiceChannel() {
            if (state.localStream) {
                state.localStream.getTracks().forEach(t => t.stop());
                state.localStream = null;
            }
            state.inVoiceChannel = false;
            state.isMuted = false;
            state.isVideoOn = false;
            voiceUI.classList.remove('active');
            localVideoContainer.classList.remove('active');
            remoteVideos.innerHTML = '';
            state.socket?.emit('leave_voice', { channel: state.currentChannel });
            // Close all peer connections
            Object.values(state.peerConnections).forEach(pc => pc.close());
            state.peerConnections = {};
        }

        function toggleMute() {
            if (!state.localStream) return;
            state.isMuted = !state.isMuted;
            state.localStream.getAudioTracks().forEach(t => t.enabled = !state.isMuted);
            muteBtn.textContent = state.isMuted ? '🔇 Unmute' : '🔊 Mute';
            muteBtn.classList.toggle('active', state.isMuted);
        }

        async function toggleVideo() {
            if (!state.inVoiceChannel) {
                showToast('Join a voice channel first', 'info');
                return;
            }
            state.isVideoOn = !state.isVideoOn;
            if (state.isVideoOn) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    state.localStream.getVideoTracks().forEach(t => t.stop());
                    state.localStream.addTrack(stream.getVideoTracks()[0]);
                    localVideo.srcObject = state.localStream;
                    localVideoContainer.classList.add('active');
                    videoBtn.textContent = '📹 Stop Video';
                    videoBtn.classList.add('active');
                } catch (err) {
                    showToast('Could not access camera', 'error');
                    state.isVideoOn = false;
                }
            } else {
                state.localStream.getVideoTracks().forEach(t => t.stop());
                const audioTracks = state.localStream.getAudioTracks();
                const newStream = new MediaStream();
                audioTracks.forEach(t => newStream.addTrack(t));
                state.localStream = newStream;
                localVideoContainer.classList.remove('active');
                videoBtn.textContent = '📹 Video';
                videoBtn.classList.remove('active');
            }
        }

        // WebRTC signaling handlers
        function handleVoiceOffer({ from, offer, channel }) {
            // Create answer
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            state.peerConnections[from] = pc;

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    state.socket?.emit('voice_ice', { to: from, candidate: e.candidate, channel });
                }
            };

            pc.ontrack = (e) => {
                const video = document.createElement('video');
                video.srcObject = e.streams[0];
                video.autoplay = true;
                video.playsInline = true;
                video.id = `remote-${from}`;
                remoteVideos.appendChild(video);
            };

            pc.setRemoteDescription(new RTCSessionDescription(offer))
                .then(() => pc.createAnswer())
                .then(answer => pc.setLocalDescription(answer))
                .then(() => {
                    state.socket?.emit('voice_answer', { to: from, answer: pc.localDescription, channel });
                });
        }

        function handleVoiceAnswer({ from, answer, channel }) {
            const pc = state.peerConnections[from];
            if (pc) {
                pc.setRemoteDescription(new RTCSessionDescription(answer));
            }
        }

        function handleVoiceIce({ from, candidate, channel }) {
            const pc = state.peerConnections[from];
            if (pc) {
                pc.addIceCandidate(new RTCIceCandidate(candidate));
            }
        }

        function updateVoiceParticipants(participants) {
            voiceParticipants.innerHTML = participants.map(p => `
                <div class="voice-participant">
                    <div class="vp-avatar">
                        ${p.username?.charAt(0).toUpperCase() || '?'}
                        ${p.speaking ? '<div class="speaking-ring"></div>' : ''}
                    </div>
                    <span class="vp-name">${p.username || 'Unknown'}</span>
                </div>
            `).join('');
        }

        // ============ FRIENDS ============
        async function loadFriends() {
            try {
                const res = await fetch('/api/friends', {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    state.friends = data.friends || [];
                    state.friendRequests = data.requests || [];
                }
            } catch (err) {
                console.error('Failed to load friends:', err);
            }
        }

        // ============ MEMBERS ============
        function renderMembers() {
            // In a real implementation, this would show actual members
            // For demo, show online users
            const members = state.onlineUsers.size || 0;
            memberCount.textContent = members || '0';
            memberList.innerHTML = Array.from(state.onlineUsers).map(id => `
                <div class="member-item">
                    <div class="member-avatar">${id.slice(0, 2).toUpperCase()}</div>
                    <span class="member-name">User ${id.slice(0, 6)}</span>
                    <span class="status-dot online"></span>
                </div>
            `).join('') || '<div style="color:var(--text-muted);font-size:13px;padding:8px;">No members online</div>';
        }

        function toggleRightPanel() {
            rightPanel.classList.toggle('active');
        }

        // ============ NAVIGATION ============
        function navigateTo(section) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const btnMap = { home: 'navHome', friends: 'navFriends', dms: 'navDMs' };
            if (btnMap[section]) $(btnMap[section])?.classList.add('active');

            if (section === 'friends') {
                showToast('Friends feature - view and manage friends', 'info');
            } else if (section === 'dms') {
                showToast('Direct Messages - coming soon with full implementation', 'info');
            } else {
                // Home - switch to general
                switchChannel('general', 'text');
            }
        }

        function toggleCommunityMenu() {
            // Expand/collapse community menu
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('communitySidebar');
            sidebar.classList.toggle('mobile-active');
        }

        function checkMobile() {
            state.isMobile = window.innerWidth <= 768;
            if (!state.isMobile) {
                document.getElementById('communitySidebar')?.classList.remove('mobile-active');
            }
        }

        // ============ SETTINGS ============
        function openSettings() {
            if (state.user) {
                $('settingsUsername').value = state.user.username || '';
                $('settingsAvatarColor').value = state.user.avatarColor || '#7c3aed';
            }
            settingsModal.classList.add('active');
        }

        function closeSettings() {
            settingsModal.classList.remove('active');
        }

        async function saveSettings() {
            const username = $('settingsUsername').value.trim();
            const avatarColor = $('settingsAvatarColor').value;
            const theme = $('settingsTheme').value;
            const notifications = $('settingsNotifications').value;

            try {
                const res = await fetch('/api/users/profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${state.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, avatarColor, theme, notifications })
                });
                if (res.ok) {
                    const data = await res.json();
                    state.user = data.user;
                    localStorage.setItem('zenith_user', JSON.stringify(state.user));
                    updateNavAvatar();
                    showToast('Settings saved!', 'success');
                    closeSettings();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Failed to save', 'error');
                }
            } catch (err) {
                showToast('Failed to save settings', 'error');
            }
        }

        // ============ LOGOUT ============
        function logout() {
            if (state.socket) {
                state.socket.disconnect();
                state.socket = null;
            }
            if (state.localStream) {
                state.localStream.getTracks().forEach(t => t.stop());
                state.localStream = null;
            }
            localStorage.removeItem('zenith_token');
            localStorage.removeItem('zenith_user');
            state.token = null;
            state.user = null;
            app.classList.remove('active');
            authScreen.classList.add('active');
            voiceUI.classList.remove('active');
            showToast('Logged out', 'info');
        }

        // ============ TOASTS ============
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============ INIT ============
        // Check for existing session
        if (!checkAuth()) {
            authScreen.classList.add('active');
        }

        // Close settings with escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSettings();
        });

        // Click outside settings to close
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        console.log('🚀 Zenith loaded successfully');
        console.log('ℹ️ Owner account: zenith / zenith123!');
    </script>
</body>
</html>
